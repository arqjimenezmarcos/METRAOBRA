<!DOCTYPE html><html lang="es" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#4a5230"><meta name="apple-mobile-web-app-capable" content="yes"><title>Aprende BIM</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"><style>:root{--bg:#f3eedc;--bg2:#e9e2c8;--fg:#232618;--mut:#5a5f3f;--acc:#4a5230;--accf:#f3eedc;--line:#d6cfae}
[data-theme=dark]{--bg:#141710;--bg2:#1e2316;--fg:#ece7d2;--mut:#b4b090;--acc:#a8b574;--accf:#141710;--line:#2d3421}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font:300 16px/1.55 'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--fg);max-width:560px;margin:0 auto;min-height:100vh;padding:0 1rem 6rem}
button,input,select{font:inherit;color:inherit}
header{position:sticky;top:0;background:var(--bg);padding:max(.8rem,env(safe-area-inset-top)) 0 .7rem;z-index:5}
.top{display:flex;justify-content:space-between;align-items:center}
h1{font-size:1.4rem;font-weight:500}h2{font-size:1.6rem;font-weight:500;margin:.6rem 0}h3{font-size:1.1rem;font-weight:500;margin:1.2rem 0 .4rem}
.mut,small{color:var(--mut)}
.ib{background:none;border:1px solid var(--line);width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:1.1rem}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:.5rem}.bar i{display:block;height:100%;background:var(--acc);transition:width .4s}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;display:flex;background:var(--bg2);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;padding:1rem .3rem;cursor:pointer;color:var(--mut)}nav button.on{color:var(--acc);font-weight:600;box-shadow:inset 0 3px var(--acc)}
.chips,.tabs{display:flex;gap:.5rem;overflow-x:auto;padding:.3rem 0 .8rem;scrollbar-width:none}
.chip,.tabs button{flex:none;padding:.5rem 1rem;border:1px solid var(--line);background:none;border-radius:99px;cursor:pointer}
.chip.on,.tabs button.on{background:var(--acc);color:var(--accf);border-color:var(--acc)}
input,select{width:100%;padding:.8rem 1rem;background:var(--bg2);border:1px solid var(--line);border-radius:10px;margin:.3rem 0 .6rem}
.card{display:flex;justify-content:space-between;align-items:center;gap:1rem;width:100%;text-align:left;background:var(--bg2);border:0;border-left:4px solid var(--acc);padding:1rem;margin-bottom:.7rem;cursor:pointer}
.card b{display:block;font-weight:500;font-size:1.05rem}.card small{display:block}.card em{display:block;font-style:normal;font-size:.92rem;margin-top:.3rem}.card i{font-style:normal;font-size:1.4rem;color:var(--acc)}
.btn{display:block;width:100%;padding:1rem;margin-top:1.2rem;background:var(--acc);color:var(--accf);border:1px solid var(--acc);cursor:pointer;font-weight:500;border-radius:10px}.btn.ghost{background:none;color:var(--acc)}
.back{background:none;border:0;color:var(--acc);padding:.5rem 0;cursor:pointer}
ol,ul{padding-left:1.3rem}li{margin:.5rem 0}
.tip{background:var(--bg2);border-left:4px solid var(--acc);padding:1rem;margin:1.2rem 0}
.kr{display:flex;gap:1rem;align-items:center;padding:.5rem 0;border-bottom:1px solid var(--line)}kbd{min-width:3.4rem;text-align:center;padding:.2rem .5rem;background:var(--acc);color:var(--accf);border-radius:6px;font:500 .9rem monospace}
.pr{margin:1rem 0}.pr span{margin-right:.5rem}
</style></head><body>
<header><div class="top"><h1>Aprende BIM</h1><span id="pt" class="mut"></span><button class="ib" id="th" aria-label="Modo claro u oscuro">◐</button></div><div class="bar"><i id="pb"></i></div></header>
<main id="m"></main>
<nav><button data-v="l">Lecciones</button><button data-v="a">Atajos</button><button data-v="p">Progreso</button></nav>
<script type="application/json" id="d">{"app":"Aprende BIM","version":1,"software":[{"id":"civil3d","n":"Civil 3D"},{"id":"revit","n":"Revit"},{"id":"autocad","n":"AutoCAD"},{"id":"navisworks","n":"Navisworks"},{"id":"grasshopper","n":"Grasshopper"}],"lecciones":[{"id":"c1","sw":"civil3d","nivel":"Básico","t":"Interfaz y plantilla","min":10,"r":"Conoce el espacio de trabajo y configura el dibujo antes de dibujar.","pasos":["Inicia desde una plantilla de Civil 3D (.dwt), no desde acad.dwt.","Abre Toolspace: Prospector (datos del dibujo), Settings (estilos), Survey y Toolbox (reportes).","En Settings, clic derecho sobre el nombre del dibujo > Edit Drawing Settings.","En Units and Zone define las unidades (metros) y el sistema de coordenadas de tu zona, por ejemplo SIRGAS-REGVEN / UTM.","Guarda el dibujo como tu propia plantilla (.dwt) para reutilizar estilos y configuración."],"consejo":"Configura la plantilla una sola vez: estilos, capas y etiquetas ahorran horas en cada proyecto.","errores":["Trabajar con unidades distintas a las del levantamiento.","Mezclar coordenadas locales con las del sistema oficial."]},{"id":"c2","sw":"civil3d","nivel":"Básico","t":"Importar puntos","min":8,"r":"Lleva los puntos del levantamiento topográfico al dibujo.","pasos":["Prepara un .txt o .csv con formato PNEZD: punto, norte, este, elevación, descripción.","Ve a la pestaña Insert > Points from File.","Elige el formato PNEZD (delimitado por comas o espacios) y selecciona el archivo.","Activa la opción de agregar los puntos a un grupo si quieres organizarlos desde el inicio.","Usa Zoom Extents (Z, Enter, E) para ver todos los puntos."],"consejo":"Revisa que no haya puntos con elevación 0 por error antes de crear la superficie.","errores":["Invertir norte y este en el formato.","Usar coma como separador decimal."]},{"id":"c3","sw":"civil3d","nivel":"Básico","t":"Superficie TIN","min":12,"r":"Crea el modelo del terreno a partir de los puntos.","pasos":["En Prospector, clic derecho en Surfaces > Create Surface.","Elige tipo TIN surface, ponle nombre y un estilo de curvas de nivel.","Expande la superficie > Definition > Point Groups > Add y selecciona el grupo.","Agrega Breaklines (líneas de quiebre) y Boundaries (contornos) para corregir triángulos erróneos.","Revisa Surface Properties > Statistics: elevación mínima, máxima y número de triángulos."],"consejo":"Usa un Outer Boundary para eliminar los triángulos largos fuera del levantamiento.","errores":["No definir límite exterior y obtener triángulos sobre zonas vacías.","Puntos duplicados con elevaciones distintas."]},{"id":"c4","sw":"civil3d","nivel":"Intermedio","t":"Alineamiento y perfil","min":15,"r":"Define el eje del trazado y su perfil longitudinal.","pasos":["Dibuja una polilínea como eje del trazado.","Home > Create Design > Alignment > Create Alignment from Objects y selecciona la polilínea.","Define estilos y estación inicial; activa agregar curvas con el radio de diseño.","Home > Profile > Create Surface Profile para el terreno natural.","Crea la vista con Create Profile View y dibuja la rasante con Profile Creation Tools."],"consejo":"Define pendientes máximas y radios mínimos según la norma de diseño vial de tu proyecto.","errores":["Tangentes sin curvas entre ellas.","Perfil de terreno desactualizado tras editar la superficie."]},{"id":"c5","sw":"civil3d","nivel":"Avanzado","t":"Corredor y volúmenes","min":20,"r":"Modela la vía y obtén el corte y relleno por estación.","pasos":["Crea un Assembly (Home > Create Design > Assembly) y agrega subensambles: carril, cuneta, talud.","Home > Corridor > Create Corridor y elige alineamiento, perfil y assembly.","Define la frecuencia de estaciones y la superficie objetivo del talud.","Genera Sample Lines (Home > Profile & Section View) y crea las vistas de sección.","Analyze > Volumes and Materials > Compute Materials para obtener corte y relleno."],"consejo":"Compara corte y relleno por estación para equilibrar el movimiento de tierras.","errores":["Usar un perfil sin rasante definida.","Sample lines que no cubren todo el corredor."]},{"id":"r1","sw":"revit","nivel":"Básico","t":"Niveles y rejillas","min":8,"r":"La base de todo modelo: alturas y ejes.","pasos":["Abre una vista de elevación, por ejemplo South.","Architecture > Datum > Level (LL) y dibuja los niveles con su cota.","Architecture > Datum > Grid (GR) para los ejes.","Renombra niveles y ejes con claridad: Nivel 1, Eje A.","Fíjalos con Pin (PN) para no moverlos por accidente."],"consejo":"Define niveles y rejillas antes de modelar muros y estructura.","errores":["Intentar dibujar niveles en una vista en planta.","Duplicar niveles en lugar de copiarlos."]},{"id":"r2","sw":"revit","nivel":"Básico","t":"Muros","min":10,"r":"Modela muros con capas y alturas bien conectadas.","pasos":["Architecture > Wall (WA) y elige el tipo en Properties.","Define Base Constraint, Top Constraint y Location Line antes de dibujar.","Dibuja por línea o con Pick Lines sobre un dibujo vinculado.","Edit Type > Structure para definir las capas: acabado, bloque, revoco.","Resuelve los encuentros con Join Geometry o Wall Joins."],"consejo":"Nombra los tipos con claridad: BLOQUE_15_REV.","errores":["Altura de muro sin conectar al nivel superior.","Capas sin material, lo que afecta cómputos y renders."]},{"id":"r3","sw":"revit","nivel":"Básico","t":"Puertas, ventanas y familias","min":10,"r":"Inserta elementos hospedados y carga familias.","pasos":["Architecture > Door (DR) o Window (WN).","Si falta el tipo, usa Insert > Load Family y carga desde la biblioteca.","Colócala sobre el muro y usa la barra espaciadora para cambiar el lado.","Ajusta la altura de alféizar en Properties.","Etiqueta con Annotate > Tag by Category (TG)."],"consejo":"Organiza tu propia biblioteca de familias por categoría.","errores":["Familias cargadas sin tipos útiles.","Colocar fuera del muro anfitrión."]},{"id":"r4","sw":"revit","nivel":"Intermedio","t":"Planos y vistas","min":12,"r":"Prepara láminas listas para imprimir.","pasos":["Duplica la vista (Duplicate View) para cada propósito: coordinación, cotas, acabados.","Ajusta escala y nivel de detalle, y controla categorías con Visibility/Graphics (VV).","View > Sheet y elige el cajetín.","Arrastra las vistas desde el Project Browser a la lámina.","Completa número y nombre del plano y verifica la lista de láminas."],"consejo":"Usa plantillas de vista (View Templates) para mantener el mismo estilo en todos los planos.","errores":["Modificar una vista usada en varias láminas sin plantilla.","Escalas distintas en una lámina sin indicarlo."]},{"id":"r5","sw":"revit","nivel":"Intermedio","t":"Tablas de cuantificación","min":12,"r":"Saca cantidades directamente del modelo.","pasos":["View > Schedules > Schedule/Quantities y elige la categoría: muros, pisos, puertas.","Agrega campos: tipo, área, volumen, longitud, cantidad.","En Filter limita por nivel o por tipo.","En Sorting/Grouping agrupa por tipo y activa Grand totals.","Exporta con File > Export > Reports > Schedule y ábrelo en Excel."],"consejo":"Crea parámetros compartidos con el código de partida y úsalos como campo de la tabla.","errores":["Contar elementos sin material asignado.","Dejar activo Itemize every instance cuando quieres totales agrupados."]},{"id":"r6","sw":"revit","nivel":"Avanzado","t":"Familias paramétricas","min":18,"r":"Crea un objeto que cambia con sus parámetros.","pasos":["File > New > Family y elige una plantilla, por ejemplo Generic Model.","Crea Reference Planes y acótalos.","Create > Extrusion y dibuja el perfil, bloqueándolo (candado) a los planos.","Create > Family Types > New Parameter: largo, ancho, alto.","Prueba los valores en Family Types y cárgala con Load into Project."],"consejo":"Prueba valores extremos de todos los parámetros antes de cargarla.","errores":["Cotas sin parámetro asociado.","Geometría sin bloquear a planos de referencia."]},{"id":"a1","sw":"autocad","nivel":"Básico","t":"Dibujo y edición básica","min":10,"r":"Los comandos que más vas a usar.","pasos":["Configura las unidades con UNITS.","Activa Ortho (F8), Polar (F10) y Object Snap (F3).","Dibuja con LINE (L), POLYLINE (PL) y CIRCLE (C).","Edita con MOVE (M), COPY (CO), TRIM (TR), OFFSET (O) y FILLET (F).","Guarda con QSAVE y crea copias con SAVEAS."],"consejo":"Aprende los alias de comando: escribir es más rápido que buscar en la cinta."},{"id":"a2","sw":"autocad","nivel":"Intermedio","t":"Capas, bloques y presentación","min":14,"r":"Organiza el dibujo y prepáralo para imprimir.","pasos":["Abre el administrador con LAYER (LA) y crea capas por función: muros, ejes, cotas.","Convierte elementos repetidos en bloques con BLOCK (B) e insértalos con INSERT (I).","Entra a una pestaña Layout y crea ventanas con MVIEW.","Define la escala de cada ventana y bloquéala con Lock Viewport.","Imprime con PLOT (Ctrl+P) usando una tabla de estilos de trazado."],"consejo":"Nunca dibujes en la capa 0: úsala solo para crear bloques."},{"id":"n1","sw":"navisworks","nivel":"Intermedio","t":"Detección de interferencias","min":12,"r":"Encuentra choques entre disciplinas antes de construir.","pasos":["Abre el modelo o une varios archivos con Append.","Abre Clash Detective desde la pestaña Home.","Crea una prueba nueva y elige Selection A y Selection B, por ejemplo estructura contra instalaciones.","Define el tipo (Hard), la tolerancia y ejecuta Run Test.","Revisa los resultados, asigna responsables y exporta el informe."],"consejo":"Empieza con pruebas pequeñas por disciplina para que los resultados sean manejables."},{"id":"g1","sw":"grasshopper","nivel":"Intermedio","t":"Primeros pasos","min":15,"r":"Diseño paramétrico dentro de Rhino.","pasos":["En Rhino escribe Grasshopper para abrir el lienzo.","Agrega componentes con doble clic y búsqueda.","Crea variaciones con Number Slider y Series para repetir puntos o líneas.","Conecta salidas con entradas arrastrando cables.","Selecciona la geometría final y usa Bake para llevarla a Rhino."],"consejo":"Agrupa (Group) y rotula las partes importantes del algoritmo.","errores":["Componentes sin conectar que dejan el resultado vacío.","Hornear (Bake) varias veces y duplicar geometría."]}],"atajos":[{"sw":"Revit","items":[["WA","Muro"],["DR","Puerta"],["WN","Ventana"],["GR","Rejilla"],["LL","Nivel"],["DI","Cota alineada"],["TG","Etiquetar por categoría"],["VV","Visibilidad y gráficos"],["MV","Mover"],["CO","Copiar"],["RO","Rotar"],["MM","Simetría con eje"],["AL","Alinear"],["TR","Recortar / extender esquina"],["SL","Dividir elemento"],["OF","Desfase"],["PN","Fijar (Pin)"],["EH","Ocultar elemento"],["VH","Ocultar categoría"],["HH","Ocultar temporalmente"],["HR","Restablecer ocultos"],["RP","Plano de referencia"]]},{"sw":"AutoCAD / Civil 3D","items":[["L","Línea"],["PL","Polilínea"],["C","Círculo"],["M","Mover"],["CO","Copiar"],["RO","Rotar"],["TR","Recortar"],["EX","Extender"],["F","Empalme"],["O","Desfase"],["MI","Simetría"],["SC","Escala"],["DI","Distancia"],["LA","Capas"],["B","Crear bloque"],["I","Insertar bloque"],["PU","Depurar"],["F3","Referencia a objetos"],["F8","Ortogonal"],["F10","Rastreo polar"],["F2","Ventana de texto"]]}]}</script>
<script>
const $=s=>document.querySelector(s),E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let D,sw='todos',q='',v='l',op=null,done=[],dk=false;
const get=k=>{try{return localStorage.getItem(k)}catch(e){return null}},set=(k,x)=>{try{localStorage.setItem(k,x)}catch(e){}};
try{done=JSON.parse(get('done')||'[]')}catch(e){}
dk=get('t')?get('t')=='d':matchMedia('(prefers-color-scheme:dark)').matches;
const theme=()=>{document.documentElement.dataset.theme=dk?'dark':'light';set('t',dk?'d':'l')};theme();
$('#th').onclick=()=>{dk=!dk;theme()};
/* Lee lecciones.json (así puedes editarlo); si no se puede, usa la copia incluida en este archivo */
fetch('lecciones.json').then(r=>r.json()).catch(()=>JSON.parse($('#d').textContent)).then(d=>{D=d;draw()});
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{v=b.dataset.v;op=null;q='';draw()});
function upd(){const p=Math.round(done.length/D.lecciones.length*100);$('#pb').style.width=p+'%';$('#pt').textContent=p+'%'}
function draw(){
  upd();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==v&&!op));
  op?det():v=='l'?lst():v=='a'?key():prg();scrollTo(0,0);
}
function lst(){
  $('#m').innerHTML=`<div class="chips">${[{id:'todos',n:'Todos'},...D.software].map(s=>`<button class="chip${s.id==sw?' on':''}" data-s="${s.id}">${s.n}</button>`).join('')}</div><input id="q" type="search" placeholder="Buscar lección…"><div id="ls"></div>`;
  $('#q').value=q;fill();
  document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{sw=b.dataset.s;lst()});
  $('#q').oninput=e=>{q=e.target.value;fill()};
}
function fill(){
  const k=q.toLowerCase();
  const r=D.lecciones.filter(l=>(sw=='todos'||l.sw==sw)&&(l.t+l.r+l.pasos.join(' ')).toLowerCase().includes(k));
  $('#ls').innerHTML=r.map(l=>`<button class="card" data-i="${l.id}"><span><b>${E(l.t)}</b><small>${D.software.find(s=>s.id==l.sw).n} · ${l.nivel} · ${l.min} min</small><em>${E(l.r)}</em></span><i>${done.includes(l.id)?'✓':'›'}</i></button>`).join('')||'<p class="mut">Sin resultados.</p>';
  document.querySelectorAll('.card').forEach(b=>b.onclick=()=>{op=b.dataset.i;draw()});
}
function det(){
  const l=D.lecciones.find(x=>x.id==op);
  $('#m').innerHTML=`<button class="back" id="bk">‹ Volver</button><h2>${E(l.t)}</h2><small>${D.software.find(s=>s.id==l.sw).n} · ${l.nivel} · ${l.min} min</small><p style="margin-top:.6rem">${E(l.r)}</p><h3>Pasos</h3><ol>${l.pasos.map(p=>`<li>${E(p)}</li>`).join('')}</ol>${l.consejo?`<div class="tip"><b>Consejo</b><br>${E(l.consejo)}</div>`:''}${l.errores?`<h3>Errores comunes</h3><ul>${l.errores.map(e=>`<li>${E(e)}</li>`).join('')}</ul>`:''}<button class="btn" id="mk"></button>`;
  const lab=()=>$('#mk').textContent=done.includes(l.id)?'Completada ✓ (tocar para desmarcar)':'Marcar como completada';lab();
  $('#bk').onclick=()=>{op=null;draw()};
  $('#mk').onclick=()=>{done=done.includes(l.id)?done.filter(x=>x!=l.id):[...done,l.id];set('done',JSON.stringify(done));lab();upd()};
}
function key(){
  $('#m').innerHTML=`<input id="q" type="search" placeholder="Buscar comando o atajo…"><div id="ks"></div>`;
  const f=()=>{const k=q.toLowerCase();$('#ks').innerHTML=D.atajos.map(g=>{const it=g.items.filter(([a,b])=>(a+b).toLowerCase().includes(k));return it.length?`<h3>${E(g.sw)}</h3>`+it.map(([a,b])=>`<div class="kr"><kbd>${E(a)}</kbd><span>${E(b)}</span></div>`).join(''):''}).join('')||'<p class="mut">Sin resultados.</p>'};
  $('#q').value=q;$('#q').oninput=e=>{q=e.target.value;f()};f();
}
function prg(){
  $('#m').innerHTML='<h2>Tu progreso</h2>'+D.software.map(s=>{const t=D.lecciones.filter(l=>l.sw==s.id),d=t.filter(l=>done.includes(l.id)).length;return `<div class="pr"><span>${s.n}</span><b>${d}/${t.length}</b><div class="bar"><i style="width:${d/t.length*100}%"></i></div></div>`}).join('')+'<button class="btn ghost" id="rs">Reiniciar progreso</button>';
  $('#rs').onclick=()=>{if(confirm('¿Borrar todo tu progreso?')){done=[];set('done','[]');draw()}};
}
</script></body></html>
